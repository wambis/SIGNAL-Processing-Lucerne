#Response file
Response_File_OBS: 'RESPOSE-FILE.XML/xj-fdsn.xml'
#Land based station Response file
Response_File_Land: 'LANDMUO_DATA/MUO_2023-10-23.xml'
#Erased ylabel, do not set it to true except you know what you're doing
Erased_ylabel: True
#Erased xlabel do not set it to true except you know what you're doing
Erased_xlabel: False
#Erase title?
Erased_title: False
#show noise model level names (NLNM and New High Noise Model NHNM)
show_nm_names: False
#check of the user want to show the colorbar
show_colorbar: True
#####specify the station type you want to plot the spectrum (NB: it should be OBS or Landbase")
#You should either plot OBS or Landbased, but not both at the same time 
Station_Type: {"OBS": False,
              "Landbased": True}
#Window dictionary, if "Windowing" is True then to need to specify the window, if not you are plotting the entire trace
#do not change "nwindows", please keep 1
WindowingDict: {"Windowing": False, "nwindows": 1}
#Correpondance between OBS componet and landbased station component
OBS_Landbased_comps: {'HH1':'Z', 'HH2':'N', 'HH3': 'E', 'HDH': 'None'}
#set the period limit you want to visualize
period_lim: [0.1, 200]
#period_lim: [0.01, 1000]
###heure:minutes:seconds
#Discharge
